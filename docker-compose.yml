networks:
  internal:

volumes:
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      device: ./data/neo4j/data
      o: bind
  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      device: ./data/neo4j/logs
      o: bind
  keycloak_postgres_data:
    driver: local
    driver_opts:
      type: none
      device: ./data/postgres
      o: bind