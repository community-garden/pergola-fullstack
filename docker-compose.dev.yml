services:

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    platform: linux/amd64
    command: serve --location /data --bind 0.0.0.0:7878
    volumes:
      - oxigraph_dev_data:/data
    networks:
      - internal-dev
    restart: unless-stopped

  oxigraph-cors:
    image: nginx:alpine
    volumes:
      - ./oxigraph-docker/nginx.config:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oxigraph
    networks:
      - traefik
      - internal-dev
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.sparql01.entrypoints=web-secure"
      - "traefik.http.routers.sparql01.rule=Host(`sparql01.pergola.kuenste.live`)"
      - "traefik.http.routers.sparql01.tls=true"
      - "traefik.http.routers.sparql01.tls.certresolver=tlschallenge"
      - "traefik.http.routers.sparql01.middlewares=secHeaders@file"
      - "traefik.http.services.sparql01.loadbalancer.server.port=80"
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: ./frontend-vite/Dockerfile.dev
    volumes:
      - ./frontend-vite:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_SPARQL_API_URL=https://sparql01.pergola.kuenste.live/query
      - VITE_HMR_HOST=dev01.pergola.kuenste.live
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev01.entrypoints=web-secure"
      - "traefik.http.routers.dev01.rule=Host(`dev01.pergola.kuenste.live`)"
      - "traefik.http.routers.dev01.tls=true"
      - "traefik.http.routers.dev01.tls.certresolver=tlschallenge"
      - "traefik.http.routers.dev01.middlewares=secHeaders@file"
      - "traefik.http.services.dev01.loadbalancer.server.port=5173"
    restart: unless-stopped

  watering-api:
    build:
      context: .
      dockerfile: ./watering-api/Dockerfile.dev
    volumes:
      - ./watering-api/src:/app/watering-api/src
    environment:
      - SPARQL_ENDPOINT_URL=http://oxigraph:7878/query
    depends_on:
      - oxigraph
    networks:
      - traefik
      - internal-dev
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.watering-api.entrypoints=web-secure"
      - "traefik.http.routers.watering-api.rule=Host(`dev01.pergola.kuenste.live`) && PathPrefix(`/api`)"
      - "traefik.http.routers.watering-api.tls=true"
      - "traefik.http.routers.watering-api.tls.certresolver=tlschallenge"
      - "traefik.http.routers.watering-api.middlewares=secHeaders@file"
      - "traefik.http.services.watering-api.loadbalancer.server.port=3000"
    restart: unless-stopped

  storybook:
    build:
      context: .
      dockerfile: ./frontend-vite/Dockerfile.dev
    volumes:
      - ./frontend-vite:/app
      - storybook_node_modules:/app/node_modules
    command: sh -c "cp /package_materialized.json /app/package.json && rm -f /app/bun.lock && bun install && bun run storybook -- --host 0.0.0.0"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storybook01.entrypoints=web-secure"
      - "traefik.http.routers.storybook01.rule=Host(`storybook01.pergola.kuenste.live`)"
      - "traefik.http.routers.storybook01.tls=true"
      - "traefik.http.routers.storybook01.tls.certresolver=tlschallenge"
      - "traefik.http.routers.storybook01.middlewares=secHeaders@file"
      - "traefik.http.services.storybook01.loadbalancer.server.port=6006"
    restart: unless-stopped

  docs:
    image: squidfunk/mkdocs-material
    command: serve --dev-addr 0.0.0.0:8000
    volumes:
      - ./docs:/docs
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs01.entrypoints=web-secure"
      - "traefik.http.routers.docs01.rule=Host(`docs01.pergola.kuenste.live`)"
      - "traefik.http.routers.docs01.tls=true"
      - "traefik.http.routers.docs01.tls.certresolver=tlschallenge"
      - "traefik.http.routers.docs01.middlewares=secHeaders@file"
      - "traefik.http.services.docs01.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  traefik:
    external: true
  internal-dev:

volumes:
  oxigraph_dev_data:
  frontend_node_modules:
  storybook_node_modules:
