site_name: Pergola Garden Dev Docs
site_description: Living documentation for the Pergola community garden platform
site_url: https://docs01.pergola.kuenste.live

theme:
  name: material
  palette:
    primary: green
    accent: light green
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy

docs_dir: docs

nav:
  - Home: index.md
  - Development:
    - Setup: development/setup.md
  - Testing:
    - E2E Tests: testing/e2e.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
