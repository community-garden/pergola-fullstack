site_name: Pergola Garden Dev Docs
site_description: Living documentation for the Pergola community garden platform
site_url: https://docs01.pergola.kuenste.live

theme:
  name: material
  palette:
    primary: green
    accent: light green
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy

docs_dir: docs

nav:
  - Home: index.md
  - Environments: environments.md
  - Development:
    - Setup: development/setup.md
  - Features:
    - LetItRain Wizard: letitrain-wizard.md
    - Watering Calendar: watering-calendar.md
    - JsonForms i18n: features/jsonforms-i18n.md
    - Season Planning: features/season-planning.md
    - Garden Map Labels: features/garden-map.md
    - Plant Images: features/plant-images.md
  - API:
    - Watering API: watering-api.md
    - Media Upload: media-upload.md
  - Testing:
    - E2E Tests: testing/e2e.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
