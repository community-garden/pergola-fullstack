server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/x-icon;
    gzip_min_length 1024;

    # Long-lived cache for hashed assets (Vite adds content hashes)
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — unknown paths serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
