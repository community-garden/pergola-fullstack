server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/x-icon;
    gzip_min_length 1024;

    # Proxy API calls to the watering-api service (same internal-dev network)
    location /api {
        proxy_pass http://watering-api-dev:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static media (plant images …), mounted from a volume. Files keep their
    # names when they are edited, so the browser revalidates (ETag) instead of
    # caching them for a year; missing files are a 404, not index.html.
    location ^~ /media/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Long-lived cache for hashed assets (Vite adds content hashes)
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — unknown paths serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
